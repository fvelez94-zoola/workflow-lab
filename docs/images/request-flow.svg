<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>How a request flows through the ports</title>
  <desc>A client calls a controller, which calls an input port interface declared in the domain model. A use case implements that port and calls an output port interface, which a driven adapter implements to reach the database, the lab or the documents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#FFFFFF"/>

  <!-- Domain band (middle) -->
  <rect x="320" y="20" width="260" height="450" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="338" y="42" font-size="13" font-weight="bold" fill="#3C3489">DOMAIN LAYER</text>

  <!-- Input port -->
  <rect x="350" y="116" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="142" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">Input port</text>
  <text x="450" y="162" font-size="12" fill="#534AB7" text-anchor="middle">interface in model</text>

  <!-- Use case -->
  <rect x="350" y="246" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="272" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">UseCase</text>
  <text x="450" y="292" font-size="12" fill="#534AB7" text-anchor="middle">class in usecase</text>

  <!-- Output port -->
  <rect x="350" y="376" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="402" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">Output port</text>
  <text x="450" y="422" font-size="12" fill="#534AB7" text-anchor="middle">interface in model</text>

  <!-- Left column: entry point (teal) -->
  <text x="40" y="42" font-size="13" font-weight="bold" fill="#085041">INFRASTRUCTURE: ENTRY POINT</text>
  <rect x="60" y="56" width="180" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="150" y="81" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">HTTP client</text>
  <rect x="60" y="116" width="180" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="150" y="142" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Controller</text>
  <text x="150" y="162" font-size="12" fill="#0F6E56" text-anchor="middle">rest-api</text>
  <line x1="150" y1="96" x2="150" y2="114" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right column: driven adapter (teal) -->
  <text x="610" y="42" font-size="13" font-weight="bold" fill="#085041">INFRASTRUCTURE: DRIVEN ADAPTER</text>
  <rect x="660" y="376" width="180" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="750" y="402" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">Adapter</text>
  <text x="750" y="422" font-size="12" fill="#0F6E56" text-anchor="middle">driven-adapters</text>
  <rect x="660" y="468" width="180" height="48" rx="24" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="750" y="490" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Database, lab,</text>
  <text x="750" y="506" font-size="13" font-weight="bold" fill="#2C2C2A" text-anchor="middle">documents</text>
  <line x1="750" y1="440" x2="750" y2="466" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- controller -> input port : calls -->
  <line x1="240" y1="148" x2="348" y2="148" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="268" y="130" width="52" height="16" fill="#FFFFFF"/>
  <text x="294" y="142" font-size="12" fill="#2C2C2A" text-anchor="middle">calls</text>

  <!-- use case implements input port (dashed, upward) -->
  <line x1="450" y1="246" x2="450" y2="182" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="460" y="205" width="72" height="16" fill="#EEEDFE"/>
  <text x="496" y="217" font-size="12" fill="#2C2C2A" text-anchor="middle">implements</text>

  <!-- use case calls output port -->
  <line x1="450" y1="310" x2="450" y2="374" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="333" width="40" height="16" fill="#EEEDFE"/>
  <text x="480" y="345" font-size="12" fill="#2C2C2A" text-anchor="middle">calls</text>

  <!-- adapter implements output port (dashed, leftward) -->
  <line x1="660" y1="408" x2="552" y2="408" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="571" y="378" width="72" height="16" fill="#FFFFFF"/>
  <text x="607" y="390" font-size="12" fill="#2C2C2A" text-anchor="middle">implements</text>

  <!-- Legend -->
  <line x1="40" y1="500" x2="90" y2="500" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="504" font-size="12" fill="#2C2C2A">call at runtime</text>
  <line x1="40" y1="522" x2="90" y2="522" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="100" y="526" font-size="12" fill="#2C2C2A">implements (points at the interface)</text>
</svg>
