<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Modules and their dependencies</title>
  <desc>Three layers: application on top, infrastructure in the middle, domain at the bottom. Every module depends on the domain model; the application layer starts the infrastructure adapters at runtime only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2C2C2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#FFFFFF"/>

  <!-- Application layer -->
  <rect x="30" y="20" width="840" height="100" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="48" y="42" font-size="13" font-weight="bold" fill="#444441">APPLICATION LAYER</text>
  <rect x="300" y="52" width="300" height="56" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="450" y="76" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="middle">app-service</text>
  <text x="450" y="95" font-size="12" fill="#5F5E5A" text-anchor="middle">main(), wiring, system and architecture tests</text>

  <!-- Infrastructure layer -->
  <rect x="30" y="180" width="840" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="48" y="202" font-size="13" font-weight="bold" fill="#085041">INFRASTRUCTURE LAYER</text>
  <rect x="50" y="214" width="200" height="112" rx="8" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="60" y="231" font-size="11" fill="#0F6E56">entry-points</text>
  <rect x="260" y="214" width="600" height="112" rx="8" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="270" y="231" font-size="11" fill="#0F6E56">driven-adapters</text>

  <rect x="60" y="240" width="180" height="76" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="150" y="266" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">rest-api</text>
  <text x="150" y="286" font-size="11" fill="#0F6E56" text-anchor="middle">OpenAPI, controllers,</text>
  <text x="150" y="301" font-size="11" fill="#0F6E56" text-anchor="middle">DTO mappers</text>

  <rect x="270" y="240" width="180" height="76" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="360" y="266" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">jpa-repository</text>
  <text x="360" y="286" font-size="11" fill="#0F6E56" text-anchor="middle">JPA entities,</text>
  <text x="360" y="301" font-size="11" fill="#0F6E56" text-anchor="middle">repository adapters</text>

  <rect x="470" y="240" width="180" height="76" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="560" y="266" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">lab-runner-log</text>
  <text x="560" y="286" font-size="11" fill="#0F6E56" text-anchor="middle">run submission</text>
  <text x="560" y="301" font-size="11" fill="#0F6E56" text-anchor="middle">adapter</text>

  <rect x="670" y="240" width="180" height="76" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="760" y="266" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">protocol-document</text>
  <text x="760" y="286" font-size="11" fill="#0F6E56" text-anchor="middle">Markdown and CSV</text>
  <text x="760" y="301" font-size="11" fill="#0F6E56" text-anchor="middle">document writer</text>

  <!-- Domain layer -->
  <rect x="30" y="410" width="840" height="130" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="48" y="432" font-size="13" font-weight="bold" fill="#3C3489">DOMAIN LAYER</text>
  <rect x="190" y="454" width="230" height="68" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="305" y="480" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">usecase</text>
  <text x="305" y="500" font-size="12" fill="#534AB7" text-anchor="middle">one @Service per use case</text>
  <rect x="500" y="454" width="230" height="68" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="615" y="480" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">model</text>
  <text x="615" y="500" font-size="12" fill="#534AB7" text-anchor="middle">rules, entities, ports</text>

  <!-- usecase -> model -->
  <line x1="420" y1="488" x2="498" y2="488" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- infrastructure -> model -->
  <line x1="150" y1="316" x2="540" y2="452" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="316" x2="575" y2="452" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="316" x2="640" y2="452" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="316" x2="690" y2="452" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app -> domain, compile time (outer margins) -->
  <path d="M300 80 H14 V488 H188" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 80 H886 V488 H732" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app -> adapters, runtime only -->
  <line x1="340" y1="108" x2="150" y2="238" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="420" y1="108" x2="360" y2="238" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="480" y1="108" x2="560" y2="238" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="560" y1="108" x2="760" y2="238" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="60" y1="572" x2="110" y2="572" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="576" font-size="12" fill="#2C2C2A">depends on at compile time</text>
  <line x1="340" y1="572" x2="390" y2="572" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="400" y="576" font-size="12" fill="#2C2C2A">runtime only (started, never referenced by code)</text>
</svg>
