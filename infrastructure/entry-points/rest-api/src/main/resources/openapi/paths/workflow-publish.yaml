# Path item. Every operation here belongs to the tag it declares.
parameters:
  - $ref: ../parameters/WorkflowId.yaml
post:
  tags:
    - Workflows
  operationId: publishWorkflow
  summary: Validate the graph and publish the workflow
  responses:
    '200':
      description: Workflow published
      content:
        application/json:
          schema:
            $ref: ../schemas/workflow/WorkflowResponse.yaml
    '404':
      $ref: ../responses/NotFound.yaml
    '409':
      $ref: ../responses/Conflict.yaml
    '422':
      $ref: ../responses/Unprocessable.yaml
