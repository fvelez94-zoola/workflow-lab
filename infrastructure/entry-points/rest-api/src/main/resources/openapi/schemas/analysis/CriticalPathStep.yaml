# DTO schema. The generated class name comes from this file name + the 'Dto' suffix.
type: object
required:
  - nodeId
  - name
  - durationSeconds
properties:
  nodeId:
    type: string
    example: incubate-1
  name:
    type: string
    example: Incubate sample
  durationSeconds:
    type: integer
    format: int64
    example: 2700
