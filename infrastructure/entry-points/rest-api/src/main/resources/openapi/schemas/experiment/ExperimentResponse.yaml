# DTO schema. The generated class name comes from this file name + the 'Dto' suffix.
type: object
required:
  - id
  - workflowId
  - status
  - createdAt
  - instructions
properties:
  id:
    type: string
    format: uuid
  workflowId:
    type: string
    format: uuid
  status:
    $ref: ExperimentStatus.yaml
  runReference:
    type: string
    description: Reference assigned by the system that executes the run
  createdAt:
    type: string
    format: date-time
  instructions:
    type: array
    items:
      $ref: Instruction.yaml
